{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Kultiva - Secure Login</title>

  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'assets/css/fontawesome.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/templatemo-space-dynamic.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/animated.css' %}">

  <style>
    /* Global Theme Colors */
    :root {
      --farm-green: #2e7d32;
      --deep-green: #1b5e20;
      --crop-yellow: #fbc02d;
    }

    /* Body Layout - Stacked Vertically for Header/Footer */
    body {
      font-family: 'Times New Roman', Times, serif !important;
      background: rgb(255,253,231);
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.4), rgba(220, 237, 200, 0.4)),
        url("{% static 'assets/images/login-bg.png' %}"), 
        linear-gradient(180deg, rgba(255,253,231,1) 0%, rgba(220,237,200,1) 50%, rgba(255,255,255,1) 100%);
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column; 
    }

    /* Login Card - Glassmorphism */
    .login-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid #c5e1a5;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      margin-top: 120px; 
      margin-bottom: 60px; 
      position: relative;
      z-index: 2;
    }

    .form-group { position: relative; margin-bottom: 20px; }
    
    .form-control-custom {
      width: 100%;
      border: none;
      border-bottom: 2px solid var(--farm-green);
      background: transparent;
      padding: 10px 0;
      font-size: 16px;
      color: #333;
      outline: none;
      transition: all 0.3s ease;
    }
    .form-control-custom:focus { border-bottom-color: var(--crop-yellow); }

    /* Eye Icon Style */
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 35px;
      cursor: pointer;
      color: var(--deep-green);
      z-index: 10;
    }

    /* Forgot Password Link */
    .forgot-pass-link {
      display: block;
      text-align: right;
      font-size: 13px;
      color: var(--farm-green);
      font-weight: bold;
      text-decoration: none;
      margin-top: 5px;
      transition: color 0.3s;
    }
    .forgot-pass-link:hover {
      color: var(--crop-yellow);
      text-decoration: underline;
    }

    .btn-login {
      width: 100%;
      background-color: var(--farm-green);
      color: #fff;
      font-size: 18px;
      padding: 12px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      margin-top: 15px;
      transition: 0.3s;
      cursor: pointer;
    }
    .btn-login:hover:not(:disabled) {
      background-color: var(--crop-yellow);
      color: #1b5e20;
    }
    .btn-login:disabled {
      background-color: #9e9e9e;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Registration Links Container */
    .reg-links {
      margin-top: 25px;
      text-align: center;
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }
    .reg-links span { font-size: 14px; color: #666; display: block; margin-bottom: 10px; }
    
    .reg-grid {
      display: flex;
      justify-content: center;
      gap: 15px;
      font-size: 14px;
    }
    .reg-grid a {
      color: var(--deep-green);
      text-decoration: none;
      font-weight: bold;
      padding: 5px 10px;
      background: rgba(46, 125, 50, 0.1);
      border-radius: 5px;
      transition: 0.2s;
    }
    .reg-grid a:hover {
      background: var(--farm-green);
      color: white;
    }
    
    /* Real-time Email Feedback Text */
    .email-feedback {
      font-size: 12px;
      font-weight: bold;
      margin-top: 5px;
      display: none;
    }
  </style>
</head>

<body>

  {% include 'header.html' %}

  <div class="login-card wow fadeInDown">
    <div class="text-center mb-4">
      <h2 style="color: #1b5e20; font-weight: bold;">Kultiva</h2>
      <p class="text-muted">Welcome Back</p>
    </div>

    {% if messages %}
      <div class="alert-container" style="margin-bottom: 20px;">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}" style="background-color: #ffebee; color: #d32f2f; padding: 12px; border-radius: 5px; border-left: 5px solid #d32f2f; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
            <i class="fa fa-exclamation-circle"></i> <strong>Error:</strong> {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form action="{% url 'login' %}" method="POST" id="loginForm">
      {% csrf_token %}
      
      <div class="form-group">
        <label style="font-weight: bold; color: #555;">Email Address</label>
        <input type="email" name="email" id="loginEmail" class="form-control-custom" placeholder="Enter your email" required>
        <div id="emailFeedbackMsg" class="email-feedback"></div>
      </div>

      <div class="form-group">
        <label style="font-weight: bold; color: #555;">Password</label>
        <input type="password" id="password" name="password" class="form-control-custom" placeholder="Enter your password" required>
        <i class="fa fa-eye toggle-password" onclick="togglePassword()"></i>
        
        <a href="/forgot-password/" class="forgot-pass-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn-login" id="loginSubmitBtn">Login Securely</button>

      <div class="reg-links">
        <span>New to Kultiva? Register as:</span>
        <div class="reg-grid">
          <a href="{% url 'register_role' 'farmer' %}"><i class="fa fa-leaf"></i> Farmer</a>
          <a href="{% url 'register_role' 'buyer' %}"><i class="fa fa-briefcase"></i> Buyer</a>
          <a href="{% url 'register_role' 'seller' %}"><i class="fa fa-shopping-cart"></i> Seller</a>
        </div>
      </div>

    </form>
  </div>

  {% include 'footer.html' %}

  <script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>
  <script src="{% static 'assets/js/animation.js' %}"></script>
  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'assets/js/templatemo-custom.js' %}"></script>

  <script>
    function togglePassword() {
      const passwordField = document.getElementById("password");
      const icon = document.querySelector(".toggle-password");
      
      if (passwordField.type === "password") {
        passwordField.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        passwordField.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    }
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
        const emailInput = document.getElementById('loginEmail');
        const feedbackMsg = document.getElementById('emailFeedbackMsg');
        const submitBtn = document.getElementById('loginSubmitBtn');

        // Check the database when the user clicks away from the email field
        emailInput.addEventListener('blur', function () {
            const email = this.value.trim();
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email && emailRegex.test(email)) {
                // Call the new backend login check endpoint
                fetch(`/check-login-email/?email=${email}`)
                    .then(response => response.json())
                    .then(data => {
                        feedbackMsg.style.display = 'block';
                        feedbackMsg.textContent = data.message;

                        if (data.status === 'active') {
                            // Account is fully active and verified
                            feedbackMsg.style.color = '#2e7d32'; // Green
                            emailInput.style.borderBottom = '2px solid #2e7d32';
                            submitBtn.disabled = false;
                        } else if (data.status === 'pending') {
                            // Account exists but hasn't been approved by Admin yet
                            feedbackMsg.style.color = '#f57f17'; // Orange
                            emailInput.style.borderBottom = '2px solid #f57f17';
                            // We leave the button enabled so Django can process it and show the detailed error message
                            submitBtn.disabled = false; 
                        } else {
                            // Account not found or banned
                            feedbackMsg.style.color = '#d32f2f'; // Red
                            emailInput.style.borderBottom = '2px solid #d32f2f';
                            submitBtn.disabled = true; // Lock the button to prevent useless submissions
                        }
                    })
                    .catch(error => console.error('AJAX Error:', error));
            } else if (email) {
                feedbackMsg.style.display = 'block';
                feedbackMsg.textContent = "Please enter a valid email format.";
                feedbackMsg.style.color = '#d32f2f';
                emailInput.style.borderBottom = '2px solid #d32f2f';
                submitBtn.disabled = true;
            }
        });

        // Clear errors immediately when the user starts typing again
        emailInput.addEventListener('input', function() {
             feedbackMsg.style.display = 'none';
             emailInput.style.borderBottom = '2px solid var(--farm-green)';
             submitBtn.disabled = false;
        });
    });
  </script>

</body>
</html>
