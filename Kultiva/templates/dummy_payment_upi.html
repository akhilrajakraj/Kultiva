{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure UPI Gateway | Kultiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base Styles matched to your reference */
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
        .checkout-container { background: #ffffff; width: 100%; max-width: 420px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); overflow: hidden; position: relative; }
        .demo-badge { background: #ff3b30; color: white; text-align: center; font-size: 11px; font-weight: 700; padding: 6px 0; letter-spacing: 1px; text-transform: uppercase; }
        .header { padding: 32px 24px 24px; text-align: center; border-bottom: 1px solid #e5e5ea; }
        .header h2 { font-size: 14px; color: #86868b; font-weight: 500; text-transform: uppercase; margin-bottom: 8px; }
        .header h1 { font-size: 42px; color: #1d1d1f; font-weight: 700; letter-spacing: -1px; }
        .payment-methods { padding: 24px; }
        .method-card { display: flex; align-items: center; padding: 16px; border: 2px solid #e5e5ea; border-radius: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s ease; }
        .method-card input[type="radio"] { display: none; }
        .radio-custom { width: 20px; height: 20px; border: 2px solid #e5e5ea; border-radius: 50%; margin-right: 16px; position: relative; }
        .radio-custom::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); width: 10px; height: 10px; border-radius: 50%; transition: 0.2s; }
        
        #gpay:checked + .method-card { border-color: #1a73e8; background: rgba(26, 115, 232, 0.04); }
        #gpay:checked + .method-card .radio-custom { border-color: #1a73e8; }
        #gpay:checked + .method-card .radio-custom::after { background: #1a73e8; transform: translate(-50%, -50%) scale(1); }
        
        #phonepe:checked + .method-card { border-color: #5f259f; background: rgba(95, 37, 159, 0.04); }
        #phonepe:checked + .method-card .radio-custom { border-color: #5f259f; }
        #phonepe:checked + .method-card .radio-custom::after { background: #5f259f; transform: translate(-50%, -50%) scale(1); }
        
        .method-icon { width: 40px; height: 40px; margin-right: 16px; display: flex; align-items: center; justify-content: center; }
        .pay-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; color: white; background: #1d1d1f; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; }
        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .success-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; opacity: 0; pointer-events: none; transition: 0.3s; }
        .success-overlay.active { opacity: 1; }
        .success-icon { width: 60px; height: 60px; background: #34c759; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="demo-badge">Gateway Mockup Environment</div>
        
        <div class="header">
            <h2>Amount to Pay</h2>
            <h1>₹ {{ total_amount }}</h1>
            <p style="color: #86868b; font-size: 13px; margin-top: 8px;">Order Ref: #KUL-{{ product.id }}</p>
        </div>

        <div class="payment-methods">
            <h3 style="font-weight: 600; margin-bottom: 16px; color: #1d1d1f;">Select UPI App</h3>

            <input type="radio" name="upi_app" id="gpay" value="gpay" checked>
            <label class="method-card" for="gpay">
                <div class="radio-custom"></div>
                <div class="method-icon"><span style="font-weight: bold; font-size: 18px; color: #5f6368;"><span style="color:#1a73e8; font-size: 22px;">G</span>Pay</span></div>
                <div><h4 style="font-size: 15px; font-weight: 600;">Google Pay</h4><p style="font-size: 13px; color: #86868b;">Fast & Secure</p></div>
            </label>

            <input type="radio" name="upi_app" id="phonepe" value="phonepe">
            <label class="method-card" for="phonepe">
                <div class="radio-custom"></div>
                <div class="method-icon"><div style="background: #5f259f; color: white; border-radius: 8px; width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-weight:bold;">पे</div></div>
                <div><h4 style="font-size: 15px; font-weight: 600;">PhonePe</h4><p style="font-size: 13px; color: #86868b;">Direct Bank Transfer</p></div>
            </label>
        </div>

        <div style="padding: 0 24px 24px;">
            <button class="pay-btn" id="payBtn" onclick="processPayment()">
                <span id="btn-text">Pay ₹ {{ total_amount }}</span>
                <div class="spinner" id="btn-spinner"></div>
            </button>
            <div style="text-align: center; margin-top: 16px; font-size: 12px; color: #86868b; font-weight: 500;">
                🔒 100% Secure Payments
            </div>
        </div>

        <div class="success-overlay" id="success-screen">
            <div class="success-icon"><svg width="30" height="30" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <h2 style="color: #1d1d1f; margin-bottom: 8px; font-weight: bold;">Payment Successful!</h2>
            <p style="color: #86868b; font-size: 14px;">Routing back to Kultiva...</p>
        </div>

        <form id="hiddenDjangoForm" method="POST" action="{% url 'process_input_order' product.id %}" style="display: none;">
            {% csrf_token %}
            <input type="hidden" name="quantity" value="{{ qty }}">
            <input type="hidden" name="payment_mode" value="UPI">
        </form>
    </div>

    <script>
        const btn = document.getElementById('payBtn');
        const radios = document.querySelectorAll('input[name="upi_app"]');
        
        radios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                btn.style.backgroundColor = e.target.value === 'gpay' ? '#1a73e8' : '#5f259f';
            });
        });
        btn.style.backgroundColor = '#1a73e8';

        function processPayment() {
            document.getElementById('btn-text').style.display = 'none';
            document.getElementById('btn-spinner').style.display = 'block';
            btn.style.cursor = 'not-allowed';

            // Simulate 2 second API connection
            setTimeout(() => {
                document.getElementById('success-screen').classList.add('active');
                
                // Wait 1.5 seconds on success screen, then SUBMIT to Django
                setTimeout(() => {
                    document.getElementById('hiddenDjangoForm').submit();
                }, 1500);

            }, 2000);
        }
    </script>
</body>
</html>
